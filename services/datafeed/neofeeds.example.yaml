# NeoFeeds Service Configuration
# Copy this file to neofeeds.yaml and customize as needed.
#
# Data source strategy:
# - Poll multiple HTTP sources and aggregate via (weighted) median.
# - Push updates on ≥0.1% deviation with 0.08% hysteresis and per-symbol throttling.
#
# Notes:
# - Binance/OKX use USDT pairs for USD pricing; the overrides below map USD -> USDT.
# - Coinbase uses USD spot endpoints.
# - Nasdaq API is used for equities and ETF proxies for metals in this example.
# - The codebase includes optional Chainlink integration, but it is disabled by default
#   to match the platform blueprint (HTTP-source median aggregation). Enable by setting ARBITRUM_RPC
#   and configuring the service accordingly.

version: "1.0"

# Update interval for evaluating + anchoring prices on-chain (default: 1s)
update_interval: 1s

# Publish policy for platform PriceFeed anchoring.
# - threshold: 0.10% (10 bps)
# - confirmation/hysteresis: 0.08% (8 bps)
# - min publish interval per symbol: 5s (throttle)
# - max publish rate per symbol: 30/min
# - optional heartbeat publish interval (below-threshold publishes only when
#   source timestamp advanced): disabled by default
publish_policy:
  threshold_bps: 10
  hysteresis_bps: 8
  min_interval: 5s
  max_per_minute: 30
  heartbeat_interval: 0s

# Default sources used when feeds don't specify their own
default_sources:
  - binance
  - okx
  - twelvedata

# Data sources configuration (multi-source median)
sources:
  - id: binance
    name: Binance
    url: "https://api.binance.com/api/v3/ticker/price?symbol={pair}"
    json_path: price
    weight: 1
    timeout: 5s
    pair_template: "{base}{quote}"
    quote_override: "USDT" # Binance uses USDT pairs for USD pricing

  - id: coinbase
    name: Coinbase
    url: "https://api.coinbase.com/v2/prices/{base}-{quote}/spot"
    json_path: data.amount
    weight: 1
    timeout: 5s

  - id: okx
    name: OKX
    url: "https://www.okx.com/api/v5/market/ticker?instId={pair}"
    json_path: data.0.last
    weight: 1
    timeout: 5s
    pair_template: "{base}-{quote}"
    quote_override: "USDT"

  - id: yahoo
    name: Yahoo Finance
    url: "https://query1.finance.yahoo.com/v7/finance/quote?symbols={base}"
    json_path: quoteResponse.result.0.regularMarketPrice
    weight: 1
    timeout: 5s

  - id: nasdaq_stocks
    name: Nasdaq API (Stocks)
    url: "https://api.nasdaq.com/api/quote/{base}/info?assetclass=stocks"
    json_path: data.primaryData.lastSalePrice
    headers:
      Accept: "application/json, text/plain, */*"
      Accept-Language: "en-US,en;q=0.9"
      Cache-Control: "no-cache"
      Origin: "https://www.nasdaq.com"
      Pragma: "no-cache"
      Referer: "https://www.nasdaq.com/"
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    weight: 1
    timeout: 8s

  - id: nasdaq_etf
    name: Nasdaq API (ETF)
    url: "https://api.nasdaq.com/api/quote/{base}/info?assetclass=etf"
    json_path: data.primaryData.lastSalePrice
    headers:
      Accept: "application/json, text/plain, */*"
      Accept-Language: "en-US,en;q=0.9"
      Cache-Control: "no-cache"
      Origin: "https://www.nasdaq.com"
      Pragma: "no-cache"
      Referer: "https://www.nasdaq.com/"
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    weight: 1
    timeout: 8s

  - id: twelvedata
    name: Twelve Data
    url: "https://api.twelvedata.com/price?symbol={base}/{quote}&apikey=REDACTED_TWELVEDATA_API_KEY"
    json_path: price
    weight: 1
    timeout: 5s

# Price feeds configuration (example set)
