# ---------------------------------------------------------------------------
# Nitro backend overrides (applied on top of docker-compose.simulation.yaml)
# ---------------------------------------------------------------------------
services:
  coordinator:
    profiles: ["donotstart"] # Disable coordinator in Nitro mode

  neofeeds:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing

  neoflow:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing

  neoaccounts:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    depends_on:
      globalsigner:
        condition: service_healthy
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing
      # Local Nitro smoke runs without coordinator key provisioning.
      NEOACCOUNTS_ALLOW_EPHEMERAL_MASTER_KEY: ${NEOACCOUNTS_ALLOW_EPHEMERAL_MASTER_KEY:-true}
      GLOBALSIGNER_SERVICE_URL: ${GLOBALSIGNER_SERVICE_URL:-http://globalsigner:8092}

  neogasbank:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    depends_on:
      neoaccounts:
        condition: service_started
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing

  neocompute:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing

  neovrf:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing

  neooracle:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing

  neorequests:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing

  txproxy:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    depends_on:
      globalsigner:
        condition: service_healthy
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing
      GLOBALSIGNER_SERVICE_URL: ${GLOBALSIGNER_SERVICE_URL:-http://globalsigner:8092}

  globalsigner:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing
      # Local Nitro smoke still runs behind Nitro TLS env, which enables strict
      # identity checks. Provide explicit defaults so globalsigner can start.
      GLOBALSIGNER_DOMAIN_ALLOWLIST: ${GLOBALSIGNER_DOMAIN_ALLOWLIST:-globalsigner:*,neoaccounts:*,neocompute:*,neofeeds:*,neoflow:*,neogasbank:*,neooracle:*,neoprivacy:*,neorequests:*,neosimulation:*,neovrf:*,txproxy:*}
      GLOBALSIGNER_SIGN_RAW_ALLOWLIST: ${GLOBALSIGNER_SIGN_RAW_ALLOWLIST:-globalsigner,neoaccounts,neocompute,neofeeds,neoflow,neogasbank,neooracle,neoprivacy,neorequests,neosimulation,neovrf,txproxy}

  neosimulation:
    build:
      dockerfile: docker/Dockerfile.service.nitro
    environment:
      TEE_BACKEND: ${TEE_BACKEND:-nitro}
      NITRO_ENV: testing
      GLOBALSIGNER_SERVICE_URL: ${GLOBALSIGNER_SERVICE_URL:-http://globalsigner:8092}
