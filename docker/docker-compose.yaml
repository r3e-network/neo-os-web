# ---------------------------------------------------------------------------
# Shared configuration anchors
# ---------------------------------------------------------------------------
x-service-defaults: &service-defaults
  volumes:
    - /var/run/aesmd:/var/run/aesmd
    - /etc/sgx_default_qcnl.conf:/etc/sgx_default_qcnl.conf:ro
  devices:
    - /dev/sgx_enclave:/dev/sgx_enclave
    - /dev/sgx_provision:/dev/sgx_provision
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped
  depends_on:
    coordinator:
      condition: service_healthy

x-build-defaults: &build-defaults
  context: ..
  dockerfile: docker/Dockerfile.service

x-build-args: &build-args
  EGO_VERSION: ${EGO_VERSION:-1.8.0}
  EGO_STRICT_SIGNING: ${EGO_STRICT_SIGNING:-1}

x-healthcheck-timing: &healthcheck-timing
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # =============================================================================
  # MarbleRun Coordinator
  # =============================================================================
  coordinator:
    image: ${MARBLERUN_COORDINATOR_IMAGE:-ghcr.io/edgelesssys/marblerun/coordinator:v1.8.0}
    container_name: marblerun-coordinator
    ports:
      - 127.0.0.1:2001:2001
      - 127.0.0.1:4433:4433
    environment:
      - EDG_COORDINATOR_MESH_ADDR=0.0.0.0:2001
      - EDG_COORDINATOR_CLIENT_ADDR=0.0.0.0:4433
      - EDG_COORDINATOR_DNS_NAMES=localhost,coordinator
      - EDG_COORDINATOR_SEAL_DIR=/coordinator/data
      - OE_SIMULATION=${OE_SIMULATION:-0}
    volumes:
      - coordinator-data:/coordinator/data
      - ../manifests:/manifests:ro
      - /var/run/aesmd:/var/run/aesmd
      - /etc/sgx_default_qcnl.conf:/etc/sgx_default_qcnl.conf:ro
    devices:
      - /dev/sgx_enclave:/dev/sgx_enclave
      - /dev/sgx_provision:/dev/sgx_provision
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:4433/api/v2/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # NeoFeeds Service Marble
  # =============================================================================
  neofeeds:
    <<: *service-defaults
    image: service-layer/neofeeds:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neofeeds
    container_name: service-neofeeds
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neofeeds
      - EDG_MARBLE_DNS_NAMES=localhost,neofeeds
      - SERVICE_TYPE=neofeeds
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - POOL_MASTER_KEY=${POOL_MASTER_KEY}
      - COORD_MASTER_SEED
      - NEOACCOUNTS_ALLOW_EPHEMERAL_MASTER_KEY
      - NEOACCOUNTS_DELETE_RETIRING_ACCOUNTS
      - ARBITRUM_RPC
      - CONTRACT_PRICEFEED_HASH
      - GASBANK_URL=${GASBANK_URL:-https://neogasbank:8091}
      # NeoFeeds delegates all on-chain writes to txproxy (single allowlist gate).
      - NEOFEEDS_ALLOW_PRIVATE_NETWORKS
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
      - TXPROXY_URL=${TXPROXY_URL:-https://txproxy:8090}
      - TXPROXY_TIMEOUT=${TXPROXY_TIMEOUT:-90s}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8083/health"]

  # =============================================================================
  # NeoFlow Service Marble
  # =============================================================================
  neoflow:
    <<: *service-defaults
    image: service-layer/neoflow:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neoflow
    container_name: service-neoflow
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neoflow
      - EDG_MARBLE_DNS_NAMES=localhost,neoflow
      - SERVICE_TYPE=neoflow
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - NEOFLOW_WEBHOOK_ALLOW_PRIVATE_NETWORKS
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - CONTRACT_PRICEFEED_HASH
      - CONTRACT_AUTOMATIONANCHOR_HASH
      - NEOFLOW_SCHEDULER_USER_ID
      - GASBANK_URL=${GASBANK_URL:-https://neogasbank:8091}
      # NeoFlow delegates all on-chain writes to txproxy (single allowlist gate).
      - TXPROXY_URL=${TXPROXY_URL:-https://txproxy:8090}
      - TXPROXY_TIMEOUT=${TXPROXY_TIMEOUT:-90s}
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8084/health"]

  # =============================================================================
  # AccountPool Service Marble (Internal)
  # =============================================================================
  neoaccounts:
    <<: *service-defaults
    image: service-layer/neoaccounts:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: accountpool
    container_name: service-accountpool
    environment:
      - NEO_TESTNET_WIF=${TEE_PRIVATE_KEY}
      - NEO_NETWORK_FEE=10000000
      - TEE_PRIVATE_KEY=${TEE_PRIVATE_KEY}
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neoaccounts
      - EDG_MARBLE_DNS_NAMES=localhost,neoaccounts,accountpool
      - SERVICE_TYPE=neoaccounts
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - POOL_MASTER_KEY=${POOL_MASTER_KEY}
      - POOL_ENCRYPTION_KEY=${POOL_ENCRYPTION_KEY}
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8085/health"]

  # =============================================================================
  # NeoGasBank Service Marble
  # =============================================================================
  neogasbank:
    <<: *service-defaults
    image: service-layer/neogasbank:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neogasbank
    container_name: service-neogasbank
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neogasbank
      - EDG_MARBLE_DNS_NAMES=localhost,neogasbank
      - SERVICE_TYPE=neogasbank
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - GASBANK_DEPOSIT_ADDRESS
      - NEOACCOUNTS_SERVICE_URL=https://neoaccounts:8085
      - TOPUP_ENABLED
      - SIMULATION_ENABLED
      - SIMULATION_MINIAPPS
      - SIMULATION_TX_INTERVAL_MIN_MS
      - SIMULATION_TX_INTERVAL_MAX_MS
      - SIMULATION_WORKERS_PER_APP
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8091/health"]
    depends_on:
      coordinator:
        condition: service_healthy
      neoaccounts:
        condition: service_started

  # =============================================================================
  # NeoCompute Service Marble
  # =============================================================================
  neocompute:
    <<: *service-defaults
    image: service-layer/neocompute:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neocompute
    container_name: service-neocompute
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neocompute
      - EDG_MARBLE_DNS_NAMES=localhost,neocompute
      - SERVICE_TYPE=neocompute
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - SECRETS_MASTER_KEY
      - NEOCOMPUTE_RESULT_TTL
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8086/health"]

  # =============================================================================
  # NeoVRF Service Marble
  # =============================================================================
  neovrf:
    <<: *service-defaults
    image: service-layer/neovrf:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neovrf
    container_name: service-neovrf
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neovrf
      - EDG_MARBLE_DNS_NAMES=localhost,neovrf,vrf
      - SERVICE_TYPE=neovrf
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8087/health"]

  # =============================================================================
  # NeoOracle Service Marble
  # =============================================================================
  neooracle:
    <<: *service-defaults
    image: service-layer/neooracle:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neooracle
    container_name: service-neooracle
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neooracle
      - EDG_MARBLE_DNS_NAMES=localhost,neooracle,oracle
      - SERVICE_TYPE=neooracle
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - SECRETS_MASTER_KEY
      - ORACLE_HTTP_ALLOWLIST
      - ORACLE_TIMEOUT
      - ORACLE_MAX_SIZE
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8088/health"]

  # =============================================================================
  # NeoRequests Service Marble
  # =============================================================================
  neorequests:
    <<: *service-defaults
    image: service-layer/neorequests:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neorequests
    container_name: service-neorequests
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neorequests
      - EDG_MARBLE_DNS_NAMES=localhost,neorequests
      - SERVICE_TYPE=neorequests
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - CONTRACT_SERVICEGATEWAY_HASH
      - NEOVRF_URL
      - NEOORACLE_URL
      - NEOCOMPUTE_URL
      - NEOREQUESTS_MAX_RESULT_BYTES
      - NEOREQUESTS_MAX_ERROR_LEN
      - NEOREQUESTS_RNG_RESULT_MODE
      - NEOREQUESTS_TX_WAIT
      - NEOREQUESTS_ENFORCE_APPREGISTRY
      - NEOREQUESTS_APPREGISTRY_CACHE_SECONDS
      - CONTRACT_APPREGISTRY_HASH
      - NEOREQUESTS_ONCHAIN_USAGE
      - NEOREQUESTS_TX_USAGE
      - NEOREQUESTS_REQUIRE_MANIFEST_CONTRACT
      - NEOREQUESTS_STATS_ROLLUP_INTERVAL
      - TXPROXY_URL=${TXPROXY_URL:-https://txproxy:8090}
      - TXPROXY_TIMEOUT=${TXPROXY_TIMEOUT:-90s}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8094/health"]

  # =============================================================================
  # TxProxy Service Marble
  # =============================================================================
  txproxy:
    <<: *service-defaults
    image: service-layer/txproxy:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: txproxy
    container_name: service-txproxy
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=txproxy
      - EDG_MARBLE_DNS_NAMES=localhost,txproxy
      - SERVICE_TYPE=txproxy
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - CONTRACT_PAYMENTHUB_HASH
      - CONTRACT_GOVERNANCE_HASH
      - TXPROXY_ALLOWLIST={"contracts":{"0xef4073a0f2b305a38ec4050e4d3d28bc40ea63f5":["*"],"0xd2a4cff31913016155e38e474a2c06d08be276cf":["*"],"0x4f494f1cc883015fcefb45f1b5182a4d3dc6be0b":["*"]}}
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8090/health"]

  # =============================================================================
  # GlobalSigner Service Marble
  # =============================================================================
  globalsigner:
    <<: *service-defaults
    image: service-layer/globalsigner:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: globalsigner
    container_name: service-globalsigner
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=globalsigner
      - EDG_MARBLE_DNS_NAMES=localhost,globalsigner
      - SERVICE_TYPE=globalsigner
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - PORT=${GLOBALSIGNER_PORT:-8092}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - GLOBALSIGNER_MASTER_SEED
      - GLOBALSIGNER_SIGN_RAW_ALLOWLIST
      - GLOBALSIGNER_MAX_BODY_BYTES
      - GLOBALSIGNER_REQUIRE_QUOTE
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:${GLOBALSIGNER_PORT:-8092}/health"]

  # =============================================================================
  # NeoSimulation Service Marble
  # =============================================================================
  neosimulation:
    <<: *service-defaults
    image: service-layer/neosimulation:latest
    build:
      <<: *build-defaults
      args:
        <<: *build-args
        SERVICE: neosimulation
    container_name: service-neosimulation
    environment:
      - EDG_MARBLE_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - EDG_MARBLE_TYPE=neosimulation
      - EDG_MARBLE_DNS_NAMES=localhost,neosimulation
      - SERVICE_TYPE=neosimulation
      - OE_SIMULATION=${OE_SIMULATION:-0}
      - MARBLE_ENV=${MARBLE_ENV:-production}
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - CONTRACT_PAYMENTHUB_HASH
      - CONTRACT_PRICEFEED_HASH
      - CONTRACT_RANDOMNESSLOG_HASH
      - NEOACCOUNTS_SERVICE_URL=https://neoaccounts:8085
      - SIMULATION_ENABLED
      - SIMULATION_MINIAPPS
      - SIMULATION_TX_INTERVAL_MIN_MS
      - SIMULATION_TX_INTERVAL_MAX_MS
      - SIMULATION_WORKERS_PER_APP
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:8093/health"]
    depends_on:
      coordinator:
        condition: service_healthy
      neoaccounts:
        condition: service_started

volumes:
  coordinator-data:
