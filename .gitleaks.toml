# GitLeaks Configuration File
# This configuration defines what patterns to look for when scanning for secrets

title = "Service Layer GitLeaks Configuration"

[allowlist]
    description = "Global allowlist"
    paths = [
        '''go.sum''',
        '''go.mod''',
        '''.*_test\.go$''',
        '''(.*?)(jpg|gif|doc|docx|zip|xls|pdf|bin|svg|xml)$''',
        '''swagger-ui''',
        '''node_modules''',
        '''\.git/''',
        '''\.gitleaks\.toml''',
    ]
    regexes = [
        '''example\.com''',
        '''testdata''',
        '''test-fixtures''',
        '''localhost''',
        '''sqlmock''',
        '''mock''',
        '''example''',
        '''TesterUser''',
        '''TestUser''',
    ]

# Predefined rules
[[rules]]
    id = "aws-access-key"
    description = "AWS Access Key"
    regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
    tags = ["aws", "key"]
    severity = "CRITICAL"

[[rules]]
    id = "aws-secret-key"
    description = "AWS Secret Key"
    regex = '''(?i)aws(.{0,20})?(?-i)['\"][0-9a-zA-Z\/+]{40}['\"]'''
    tags = ["aws", "key"]
    severity = "CRITICAL"

[[rules]]
    id = "azure-service-principal"
    description = "Azure Service Principal"
    regex = '''(?i)azure(.{0,20})?(?-i)['\"][0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}['\"]'''
    tags = ["azure", "key"]
    severity = "CRITICAL"

# Neo private keys are the secret class this repo has actually leaked (audit
# finding C-6, 2026-05-19). The generic rules above cannot catch them: each one
# anchors on a keyword such as `aws`, `azure`, `api_key`, `password` or `Bearer`
# within a few characters of the match, and a bare 52-character base58 WIF
# carries no such keyword. These two rules are the only ones here that match on
# shape alone, which is why they must not be removed again.
#
# Enforcement lives in `npm run check:repo:secret-material`, which applies the
# same shapes with no external dependency; keep the two in step.
[[rules]]
    id = "neo-wif-private-key"
    description = "Neo private key in Wallet Import Format (grants full account control)"
    regex = '''(?:^|[^0-9A-Za-z])[KL][1-9A-HJ-NP-Za-km-z]{51}(?:[^0-9A-Za-z]|$)'''
    tags = ["neo", "key", "wif"]
    severity = "CRITICAL"
    [rules.allowlist]
        description = "Published WIF for private key 0x00..01, pinned as a conversion test vector"
        regexes = ['''KwDiBf89QgGbjEhKnhXJuH7LrciVrZi3qYjgd9M7rFU73sVHnoWn''']

[[rules]]
    id = "neo-nep2-private-key"
    description = "NEP-2 passphrase-encrypted Neo private key"
    regex = '''(?:^|[^0-9A-Za-z])6P[1-9A-HJ-NP-Za-km-z]{56}(?:[^0-9A-Za-z]|$)'''
    tags = ["neo", "key", "nep2"]
    severity = "CRITICAL"

[[rules]]
    id = "azure-storage-key"
    description = "Azure Storage Account Key"
    regex = '''(?i)azure(.{0,20})?(?-i)['\"][a-zA-Z0-9+\/=]{88}['\"]'''
    tags = ["azure", "storage"]
    severity = "CRITICAL"

[[rules]]
    id = "google-api-key"
    description = "Google API Key"
    regex = '''(?i)(google|gcp|youtube|drive|yt)(.{0,20})?['\"][AIza[0-9a-zA-Z_\-]{35}]['\"]'''
    tags = ["google", "key"]
    severity = "CRITICAL"

[[rules]]
    id = "password-in-code"
    description = "Password in Code"
    regex = '''(?i)(password|passwd|pwd)(.{0,20})?['"][^'"]{3,}['"]'''
    tags = ["password"]
    severity = "HIGH"
    [rules.allowlist]
        regexes = [
            '''example''',
            '''placeholder''',
            '''test''',
            '''fake''',
            '''mock''',
            '''dummy''',
        ]

[[rules]]
    id = "authorization-bearer"
    description = "Authorization Bearer Token"
    regex = '''(?i)(auth.*bearer|bearer.*token)(.{0,20})?['"][A-Za-z0-9+/=]{8,}['"]'''
    tags = ["token", "auth"]
    severity = "HIGH"
    [rules.allowlist]
        regexes = [
            '''example''',
            '''placeholder''',
            '''test''',
            '''fake''',
            '''mock''',
            '''dummy''',
        ]

[[rules]]
    id = "api-key"
    description = "Generic API Key"
    regex = '''(?i)(api[-_]?key)(.{0,20})?['"][a-zA-Z0-9_\-]{16,}['"]'''
    tags = ["api", "key"]
    severity = "HIGH"
    [rules.allowlist]
        regexes = [
            '''example''',
            '''placeholder''',
            '''test''',
            '''fake''',
            '''mock''',
            '''dummy''',
        ]

[[rules]]
    id = "jwt-token"
    description = "JWT Token"
    regex = '''eyJ[a-zA-Z0-9_-]{5,}\.eyJ[a-zA-Z0-9_-]{5,}\.[a-zA-Z0-9_-]{5,}'''
    tags = ["jwt", "token"]
    severity = "HIGH"
    [rules.allowlist]
        regexes = [
            '''example''',
            '''placeholder''',
            '''test''',
            '''fake''',
            '''mock''',
            '''dummy''',
        ]

[[rules]]
    id = "database-connection-string"
    description = "Database Connection String"
    regex = '''(?i)(connectionstring|connstr|db_conn|database_url)(.{0,20})?['"](Data Source|Server|Database|Uid|Pwd|User Id|Initial Catalog)=.*?['"]'''
    tags = ["database", "connection"]
    severity = "HIGH"
    [rules.allowlist]
        regexes = [
            '''example''',
            '''placeholder''',
            '''test''',
            '''fake''',
            '''mock''',
            '''dummy''',
        ] 
