name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      run_deep_validation:
        description: Run expensive repository verification, Playwright setup, and integration tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-node:
    name: Fast Node Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — audit fix M-22 (pinned to SHA)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6 — audit fix M-22 (pinned to SHA)
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The deploy-script gates lint every tracked shell script with shellcheck
      # and kill a real listener with lsof. Without these the gates would fail
      # here rather than skip, which is the point: a skipped gate reports the
      # same green as a passing one. See deploy/scripts/lib/required_tool.mjs.
      - name: Install deploy-script gate tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck lsof
          shellcheck --version
          command -v lsof

      - name: Lint
        run: npm run -s lint

      - name: Validate Morpheus runtime catalog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const catalog = fs.readFileSync('apps/shared/constants/generated-morpheus-runtime-catalog.ts', 'utf8');
          for (const fragment of ['MORPHEUS_PUBLIC_RUNTIME_CATALOG', '2026-04-tee-v1', 'automation.upkeep', 'paymaster.authorize']) {
            if (!catalog.includes(fragment)) {
              throw new Error(`missing runtime catalog fragment: ${fragment}`);
            }
          }
          NODE

      - name: Run fast host-app tests
        run: npm --prefix platform/host-app test -- --runTestsByPath __tests__/lib/fetch-client.test.ts __tests__/lib/morpheus-endpoints.test.ts --runInBand

      - name: Run deploy-script unit tests
        run: npm run -s test:deploy-scripts

      - name: Run shared miniapp library tests
        run: npm run -s test:shared

      - name: Verify Goose Basket Shuffle release candidate
        run: npm --workspace miniapp-zhuada-e run verify:release

      - name: Typecheck SDK
        run: npm --prefix platform/sdk run typecheck

  contracts:
    name: Contract Tests (.NET / NeoVM TestEngine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — audit fix M-22 (pinned to SHA)

      - name: Set up .NET
        # NOTE: pin to the v5 commit SHA to match this repo's M-22 action-pinning policy
        # before merging (kept as a version tag here because the SHA must be verified).
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Neo contract compiler (nccs)
        run: dotnet tool install --global Neo.Compiler.CSharp --version 3.9.1

      - name: Compile contract NEFs (nccs)
        run: npm run -s build:contracts

      - name: Run contract test suite (xUnit + TestEngine)
        run: npm run -s test:contracts

  go-format:
    name: Format Check (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — audit fix M-22 (pinned to SHA)

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6 — audit fix M-22 (pinned to SHA)
        with:
          go-version: 1.24.x
          cache: true

      - name: Verify gofmt
        shell: bash
        run: |
          set -euo pipefail

          go_files="$(mktemp)"
          git ls-files -z '*.go' > "$go_files"
          if [ ! -s "$go_files" ]; then
            rm -f "$go_files"
            echo "No Go files found."
            exit 0
          fi

          unformatted="$(xargs -0 gofmt -s -l < "$go_files")"
          rm -f "$go_files"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            echo "Run: make fmt"
            exit 1
          fi

          echo "All Go files are properly formatted."

  deep-validation:
    name: Deep Validation (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_deep_validation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — audit fix M-22 (pinned to SHA)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6 — audit fix M-22 (pinned to SHA)
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # verify:repo runs the deploy-script gates too (scripts/verify_repo.sh),
      # so this job needs the same tools as fast-node.
      - name: Install deploy-script gate tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck lsof
          shellcheck --version
          command -v lsof

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run production repository verification
        run: npm run -s verify:repo

      - name: Run integration tests
        run: npm run -s test:integration
