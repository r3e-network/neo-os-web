name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  node:
    name: Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Morpheus runtime catalog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const catalog = fs.readFileSync('apps/shared/constants/generated-morpheus-runtime-catalog.ts', 'utf8');
          for (const fragment of ['MORPHEUS_PUBLIC_RUNTIME_CATALOG', '2026-04-tee-v1', 'automation.upkeep', 'paymaster.authorize']) {
            if (!catalog.includes(fragment)) {
              throw new Error(`missing runtime catalog fragment: ${fragment}`);
            }
          }
          NODE

      - name: Run production repository verification
        run: npm run -s verify:repo

      - name: Run integration tests
        run: npm run -s test:integration

  format:
    name: Format Check (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
          cache: true

      - name: Verify gofmt
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t go_files < <(git ls-files '*.go')
          if [ "${#go_files[@]}" -eq 0 ]; then
            echo "No Go files found."
            exit 0
          fi

          unformatted="$(gofmt -s -l "${go_files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            echo "Run: make fmt"
            exit 1
          fi

          echo "All Go files are properly formatted."
