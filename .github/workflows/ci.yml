name: CI Pipeline
on:
  push:
    branches:
    - main
    - master
    - develop
  pull_request:
    branches:
    - main
    - master
    - develop
permissions:
  contents: read
jobs:
  format:
    name: Format Check (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.x
        cache: true
    - name: Verify gofmt
      shell: bash
      run: "set -euo pipefail\n\nmapfile -t go_files < <(git ls-files '*.go')\nif\
        \ [ \"${#go_files[@]}\" -eq 0 ]; then\n  echo \"No Go files found.\"\n  exit\
        \ 0\nfi\n\nunformatted=\"$(gofmt -s -l \"${go_files[@]}\")\"\nif [ -n \"$unformatted\"\
        \ ]; then\n  echo \"Unformatted Go files:\"\n  echo \"$unformatted\"\n  echo\
        \ \"Run: make fmt\"\n  exit 1\nfi\n\necho \"All Go files are properly formatted.\"\
        \n"
