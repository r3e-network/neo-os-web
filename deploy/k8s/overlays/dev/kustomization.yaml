apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-layer

resources:
  - ../nitro

# Local dev/test images are built/imported with the `:test` tag.
images:
  - name: service-layer/neofeeds
    newTag: test
  - name: service-layer/neoflow
    newTag: test
  - name: service-layer/neoaccounts
    newTag: test
  - name: service-layer/neocompute
    newTag: test
  - name: service-layer/neovrf
    newTag: test
  - name: service-layer/neooracle
    newTag: test
  - name: service-layer/neorequests
    newTag: test
  - name: service-layer/txproxy
    newTag: test
  - name: service-layer/globalsigner
    newTag: test

# Dev overlay: local Supabase, test contract hashes.
patches:
  - target:
      kind: ConfigMap
      name: service-layer-config
    patch: |-
      - op: replace
        path: /data/NITRO_ENV
        value: "testing"
      - op: replace
        path: /data/TXPROXY_TIMEOUT
        value: "90s"
      - op: replace
        path: /data/SUPABASE_URL
        value: "http://postgrest.supabase.svc.cluster.local:3000"
      - op: replace
        path: /data/SUPABASE_REST_PREFIX
        value: "/"
      - op: replace
        path: /data/SUPABASE_ALLOW_INSECURE
        value: "true"
      - op: replace
        path: /data/GLOBALSIGNER_SERVICE_URL
        value: "http://globalsigner:8092"
      - op: replace
        path: /data/TXPROXY_URL
        value: "http://txproxy:8090"
      - op: replace
        path: /data/GASBANK_URL
        value: "http://neogasbank:8091"
      - op: replace
        path: /data/NEOACCOUNTS_SERVICE_URL
        value: "http://neoaccounts:8085"
      - op: replace
        path: /data/NEOCOMPUTE_URL
        value: "http://neocompute:8086"
      - op: replace
        path: /data/NEOVRF_URL
        value: "http://neovrf:8087"
      - op: replace
        path: /data/NEOORACLE_URL
        value: "http://neooracle:8088"
      - op: replace
        path: /data/NEOFEEDS_URL
        value: "http://neofeeds:8083"
      - op: replace
        path: /data/NEOFLOW_URL
        value: "http://neoflow:8084"
      - op: replace
        path: /data/CONTRACT_GOVERNANCE_HASH
        value: "0xc8f3bbe1c205c932aab00b28f7df99f9bc788a05"
      - op: replace
        path: /data/CONTRACT_PRICEFEED_HASH
        value: "0xc5d9117d255054489d1cf59b2c1d188c01bc9954"
      - op: replace
        path: /data/CONTRACT_RANDOMNESSLOG_HASH
        value: "0x76dfee17f2f4b9fa8f32bd3f4da6406319ab7b39"
      - op: replace
        path: /data/CONTRACT_APPREGISTRY_HASH
        value: "0x79d16bee03122e992bb80c478ad4ed405f33bc7f"
      - op: replace
        path: /data/CONTRACT_AUTOMATIONANCHOR_HASH
        value: "0x1c888d699ce76b0824028af310d90c3c18adeab5"
      - op: replace
        path: /data/CONTRACT_SERVICEGATEWAY_HASH
        value: "0x27b79cf631eff4b520dd9d95cd1425ec33025a53"

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      environment: dev
