# ---------------------------------------------------------------------------
# Shared configuration anchors (Base Runtime Stack)
# ---------------------------------------------------------------------------
x-sim-defaults: &sim-defaults
  restart: unless-stopped

x-build-defaults: &build-defaults
  context: ..
  dockerfile: docker/Dockerfile.service.nitro

services:
  # =============================================================================
  # NitroRun Coordinator (Base Runtime Stack)
  # =============================================================================
  coordinator:
    # image: nitrorun-coordinator
    container_name: nitrorun-coordinator
    ports:
      - 127.0.0.1:2001:2001
      - 127.0.0.1:4433:4433
    environment:
      - # EDG_COORDINATOR_MESH_ADDR=0.0.0.0:2001
      - # EDG_COORDINATOR_CLIENT_ADDR=0.0.0.0:4433
      - # EDG_COORDINATOR_DNS_NAMES=localhost,coordinator
      - # EDG_COORDINATOR_SEAL_DIR=/coordinator/data
      - POOL_ENCRYPTION_KEY
    volumes:
      - coordinator-data:/coordinator/data
      - ../manifests:/manifests:ro
    restart: unless-stopped

  # =============================================================================
  # NeoFeeds Service Nitro
  # =============================================================================
  neofeeds:
    <<: *sim-defaults
    image: service-layer/neofeeds:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neofeeds
    container_name: service-neofeeds
    ports:
      - 127.0.0.1:${NEOFEEDS_PORT:-8083}:${NEOFEEDS_PORT:-8083}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neofeeds
      - NITRO_DNS_NAMES=localhost,neofeeds
      - SERVICE_TYPE=neofeeds
      - PORT=${NEOFEEDS_PORT:-8083}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - ARBITRUM_RPC
      - CONTRACT_PRICEFEED_HASH
      - GASBANK_URL=${GASBANK_URL:-https://neogasbank:8091}
      # NeoFeeds delegates all on-chain writes to txproxy (single allowlist gate).
      - NEOFEEDS_ALLOW_PRIVATE_NETWORKS
      - NEOFEEDS_UPDATE_INTERVAL
      - NEOFEEDS_PUBLISH_THRESHOLD_BPS
      - NEOFEEDS_PUBLISH_HYSTERESIS_BPS
      - NEOFEEDS_PUBLISH_MIN_INTERVAL
      - NEOFEEDS_PUBLISH_MAX_PER_MINUTE
      - NEOFEEDS_PUBLISH_HEARTBEAT_INTERVAL
      - TXPROXY_URL=${TXPROXY_URL:-https://txproxy:8090}
      - TXPROXY_TIMEOUT=${TXPROXY_TIMEOUT:-90s}

  # =============================================================================
  # NeoFlow Service Nitro
  # =============================================================================
  neoflow:
    <<: *sim-defaults
    image: service-layer/neoflow:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neoflow
    container_name: service-neoflow
    ports:
      - 127.0.0.1:${NEOFLOW_PORT:-8084}:${NEOFLOW_PORT:-8084}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neoflow
      - NITRO_DNS_NAMES=localhost,neoflow
      - SERVICE_TYPE=neoflow
      - PORT=${NEOFLOW_PORT:-8084}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - NEOFLOW_WEBHOOK_ALLOW_PRIVATE_NETWORKS
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - CONTRACT_PRICEFEED_HASH
      - CONTRACT_AUTOMATIONANCHOR_HASH
      - NEOFLOW_SCHEDULER_USER_ID
      - GASBANK_URL=${GASBANK_URL:-https://neogasbank:8091}
      # NeoFlow delegates all on-chain writes to txproxy (single allowlist gate).
      - TXPROXY_URL=${TXPROXY_URL:-https://txproxy:8090}
      - TXPROXY_TIMEOUT=${TXPROXY_TIMEOUT:-90s}

  # =============================================================================
  # NeoAccounts Service Nitro
  # =============================================================================
  neoaccounts:
    <<: *sim-defaults
    image: service-layer/neoaccounts:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: accountpool
    container_name: service-neoaccounts
    ports:
      - 127.0.0.1:${NEOACCOUNTS_PORT:-8085}:${NEOACCOUNTS_PORT:-8085}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neoaccounts
      - NITRO_DNS_NAMES=localhost,neoaccounts,accountpool
      - SERVICE_TYPE=neoaccounts
      - PORT=${NEOACCOUNTS_PORT:-8085}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - TEE_PRIVATE_KEY
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
      - POOL_MASTER_KEY
      - POOL_ENCRYPTION_KEY
      - COORD_MASTER_SEED
      - NEOACCOUNTS_ALLOW_EPHEMERAL_MASTER_KEY
      - NEOACCOUNTS_DELETE_RETIRING_ACCOUNTS
    depends_on:
      globalsigner:
        condition: service_healthy

  # =============================================================================
  # NeoGasBank Service Nitro
  # =============================================================================
  neogasbank:
    <<: *sim-defaults
    image: service-layer/neogasbank:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neogasbank
    container_name: service-neogasbank
    ports:
      - 127.0.0.1:${NEOGASBANK_PORT:-8091}:${NEOGASBANK_PORT:-8091}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neogasbank
      - NITRO_DNS_NAMES=localhost,neogasbank
      - SERVICE_TYPE=neogasbank
      - PORT=${NEOGASBANK_PORT:-8091}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - GASBANK_DEPOSIT_ADDRESS
      - NEOACCOUNTS_SERVICE_URL=https://neoaccounts:8085
      - TOPUP_ENABLED
    depends_on:
      neoaccounts:
        condition: service_started

  # =============================================================================
  # NeoCompute Service Nitro
  # =============================================================================
  neocompute:
    <<: *sim-defaults
    image: service-layer/neocompute:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neocompute
    container_name: service-neocompute
    ports:
      - 127.0.0.1:${NEOCOMPUTE_PORT:-8086}:${NEOCOMPUTE_PORT:-8086}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neocompute
      - NITRO_DNS_NAMES=localhost,neocompute
      - SERVICE_TYPE=neocompute
      - PORT=${NEOCOMPUTE_PORT:-8086}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - SECRETS_MASTER_KEY
      - NEOCOMPUTE_RESULT_TTL

  # =============================================================================
  # NeoVRF Service Nitro
  # =============================================================================
  neovrf:
    <<: *sim-defaults
    image: service-layer/neovrf:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neovrf
    container_name: service-neovrf
    ports:
      - 127.0.0.1:${NEOVRF_PORT:-8087}:${NEOVRF_PORT:-8087}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neovrf
      - NITRO_DNS_NAMES=localhost,neovrf,vrf
      - SERVICE_TYPE=neovrf
      - PORT=${NEOVRF_PORT:-8087}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC

  # =============================================================================
  # NeoOracle Service Nitro
  # =============================================================================
  neooracle:
    <<: *sim-defaults
    image: service-layer/neooracle:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neooracle
    container_name: service-neooracle
    ports:
      - 127.0.0.1:${NEOORACLE_PORT:-8088}:${NEOORACLE_PORT:-8088}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neooracle
      - NITRO_DNS_NAMES=localhost,neooracle,oracle
      - SERVICE_TYPE=neooracle
      - PORT=${NEOORACLE_PORT:-8088}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - SECRETS_MASTER_KEY
      - ORACLE_HTTP_ALLOWLIST
      - ORACLE_TIMEOUT
      - ORACLE_MAX_SIZE

  # =============================================================================
  # NeoRequests Service Nitro
  # =============================================================================
  neorequests:
    <<: *sim-defaults
    image: service-layer/neorequests:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neorequests
    container_name: service-neorequests
    ports:
      - 127.0.0.1:${NEOREQUESTS_PORT:-8094}:${NEOREQUESTS_PORT:-8094}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neorequests
      - NITRO_DNS_NAMES=localhost,neorequests
      - SERVICE_TYPE=neorequests
      - PORT=${NEOREQUESTS_PORT:-8094}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - CONTRACT_SERVICEGATEWAY_HASH
      - NEO_EVENT_START_BLOCK
      - NEO_EVENT_BACKFILL_BLOCKS
      - NEO_EVENT_CONFIRMATIONS
      - NEO_EVENT_LISTEN_ALL
      - NEOVRF_URL
      - NEOORACLE_URL
      - NEOCOMPUTE_URL
      - NEOREQUESTS_MAX_RESULT_BYTES
      - NEOREQUESTS_MAX_ERROR_LEN
      - NEOREQUESTS_RNG_RESULT_MODE
      - NEOREQUESTS_TX_WAIT
      - NEOREQUESTS_ENFORCE_APPREGISTRY
      - NEOREQUESTS_APPREGISTRY_CACHE_SECONDS
      - TXPROXY_URL=${TXPROXY_URL:-https://txproxy:8090}
      - TXPROXY_TIMEOUT=${TXPROXY_TIMEOUT:-90s}

  # =============================================================================
  # TxProxy Service Nitro
  # =============================================================================
  txproxy:
    <<: *sim-defaults
    image: service-layer/txproxy:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: txproxy
    container_name: service-txproxy
    ports:
      - 127.0.0.1:${TXPROXY_PORT:-8090}:${TXPROXY_PORT:-8090}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=txproxy
      - NITRO_DNS_NAMES=localhost,txproxy
      - SERVICE_TYPE=txproxy
      - PORT=${TXPROXY_PORT:-8090}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - CONTRACT_GOVERNANCE_HASH
      - CONTRACT_PRICEFEED_HASH
      - CONTRACT_RANDOMNESSLOG_HASH
      - CONTRACT_AUTOMATIONANCHOR_HASH
      - CONTRACT_SERVICEGATEWAY_HASH
      - TXPROXY_ALLOWLIST
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
    depends_on:
      globalsigner:
        condition: service_healthy

  # =============================================================================
  # GlobalSigner Service Nitro
  # =============================================================================
  globalsigner:
    <<: *sim-defaults
    image: service-layer/globalsigner:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: globalsigner
    container_name: service-globalsigner
    ports:
      - 127.0.0.1:${GLOBALSIGNER_PORT:-8092}:${GLOBALSIGNER_PORT:-8092}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=globalsigner
      - NITRO_DNS_NAMES=localhost,globalsigner
      - SERVICE_TYPE=globalsigner
      - PORT=${GLOBALSIGNER_PORT:-8092}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - GLOBALSIGNER_MASTER_SEED
      - TEE_PRIVATE_KEY
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8092"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # =============================================================================
  # NeoSimulation Service Nitro
  # =============================================================================
  neosimulation:
    <<: *sim-defaults
    image: service-layer/neosimulation:latest
    build:
      <<: *build-defaults
      args:
        SERVICE: neosimulation
    container_name: service-neosimulation
    ports:
      - 127.0.0.1:${NEOSIMULATION_PORT:-8093}:${NEOSIMULATION_PORT:-8093}
    environment:
      - NITRO_COORDINATOR_ADDR=${COORDINATOR_MESH_ADDR:-coordinator:2001}
      - NITRO_TYPE=neosimulation
      - NITRO_DNS_NAMES=localhost,neosimulation
      - SERVICE_TYPE=neosimulation
      - PORT=${NEOSIMULATION_PORT:-8093}
      - NITRO_ENV=${NITRO_ENV:-development}
      - METRICS_ENABLED
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - NEO_RPC_URL
      - NEO_NETWORK_MAGIC
      - NEOACCOUNTS_SERVICE_URL=https://neoaccounts:8085
      - GLOBALSIGNER_SERVICE_URL=${GLOBALSIGNER_SERVICE_URL:-https://globalsigner:8092}
      - SIMULATION_ENABLED=${SIMULATION_ENABLED:-true}
      - SIMULATION_MINIAPPS=${SIMULATION_MINIAPPS:-miniapp-fogplay,miniapp-gasbox,miniapp-redenvelope,miniapp-onchaintarot,miniapp-profitanchor,miniapp-trustanchor,miniapp-neo-x-bridge,miniapp-neo-swap}
      - SIMULATION_TX_INTERVAL_MIN_MS=${SIMULATION_TX_INTERVAL_MIN_MS:-15000}
      - SIMULATION_TX_INTERVAL_MAX_MS=${SIMULATION_TX_INTERVAL_MAX_MS:-15000}
      - SIMULATION_WORKERS_PER_APP=${SIMULATION_WORKERS_PER_APP:-1}
      # Contract hashes for MiniApp workflow simulation
      - CONTRACT_PRICEFEED_HASH=0xc5d9117d255054489d1cf59b2c1d188c01bc9954
      - CONTRACT_RANDOMNESSLOG_HASH=0x76dfee17f2f4b9fa8f32bd3f4da6406319ab7b39
