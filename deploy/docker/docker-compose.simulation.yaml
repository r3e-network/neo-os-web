      # DeFi MiniApp contracts
      - CONTRACT_MINIAPP_PREDICTIONMARKET_HASH=0x64118096bd004a2bcb010f4371aba45121eca790
      - CONTRACT_MINIAPP_FLASHLOAN_HASH=0xde8e595d8d3c293731db499367ee2a768e1e458b
