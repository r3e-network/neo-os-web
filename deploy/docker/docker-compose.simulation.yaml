      - CONTRACT_MINIAPP_REDENVELOPE_HASH=0x5f371cc50116bb13d79554d96ccdd6e246cd5d59
      - CONTRACT_MINIAPP_GASCIRCLE_HASH=0x4630b40a4e67882cfab3d3f5041c1da597b0c7b6
