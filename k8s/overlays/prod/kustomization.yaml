apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-layer

resources:
  - ../nitro
  - pdb.yaml
  - networkpolicy.yaml

patches:
  - target:
      kind: ConfigMap
      name: service-layer-config
    patch: |-
      - op: replace
        path: /data/NITRO_ENV
        value: "production"
      - op: add
        path: /data/TEE_STRICT_MODE
        value: "true"
      - op: add
        path: /data/STRICT_IDENTITY_ON_TEE
        value: "true"
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TEE_STRICT_MODE
          valueFrom:
            configMapKeyRef:
              name: service-layer-config
              key: TEE_STRICT_MODE
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRICT_IDENTITY_ON_TEE
          valueFrom:
            configMapKeyRef:
              name: service-layer-config
              key: STRICT_IDENTITY_ON_TEE
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NITRO_CERT
          valueFrom:
            secretKeyRef:
              name: nitro-tee-identity
              key: cert.pem
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NITRO_KEY
          valueFrom:
            secretKeyRef:
              name: nitro-tee-identity
              key: key.pem
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NITRO_ROOT_CA
          valueFrom:
            secretKeyRef:
              name: nitro-tee-identity
              key: ca.pem

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      environment: prod
