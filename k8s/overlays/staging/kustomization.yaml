# Staging overlay: SGX hardware mode with hardening (merged from sgx-hardware + sgx-hardware-hardened)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-layer

resources:
  - ../prod

patches:
  # SGX hardware patches: aesmd socket + enclave resources for all services
  - target:
      kind: Deployment
      name: neofeeds
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: aesmd-socket
          hostPath:
            path: /var/run/aesmd
            type: Directory
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: aesmd-socket
          mountPath: /var/run/aesmd
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/sgx.intel.com~1enclave
        value: "1"
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/sgx.intel.com~1provision
        value: "1"

  - target:
      kind: Deployment
      name: neoflow
