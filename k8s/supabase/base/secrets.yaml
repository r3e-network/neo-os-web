# =============================================================================
# Supabase Secrets Template
# Generated values are written by scripts/supabase-k3s.sh at deploy time.
# Do not commit runtime secrets to version control.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: supabase-secrets
  namespace: supabase
type: Opaque
stringData:
  # PostgreSQL password
  POSTGRES_PASSWORD: ""

  # Database connection URL
  DATABASE_URL: ""

  # JWT Secret (used for signing tokens)
  JWT_SECRET: ""

  # Anon Key (JWT with 'anon' role, no expiry)
  ANON_KEY: ""

  # Service Role Key (JWT with 'service_role' role, no expiry)
  SERVICE_ROLE_KEY: ""
