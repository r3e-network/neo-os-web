  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fdf6e6"/>
      <stop offset="0.52" stop-color="#f5ead2"/>
      <stop offset="1" stop-color="#eaddb8"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="0.78" cy="0.42" r="0.52">
      <stop offset="0" stop-color="#f0c866" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f0c866" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0.16" cy="0.34" r="0.46">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
