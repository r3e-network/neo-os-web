      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7d9c5b" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Calms the lower-centre so the description copy always has a quiet bed,
