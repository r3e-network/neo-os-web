<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Reference frame at 24 seconds</title>
    <style>
      html, body { width: 308px; height: 720px; margin: 0; overflow: hidden; background: #000; }
      video { display: block; width: 308px; height: 720px; object-fit: contain; }
    </style>
  </head>
  <body>
    <video muted playsinline preload="auto" src="http://127.0.0.1:8181/dafbaff250624322fdc1a20b4e5b6e8f.mp4"></video>
    <script>
      const video = document.querySelector("video");
      video.addEventListener("loadedmetadata", () => { video.currentTime = 24; }, { once: true });
      video.addEventListener("seeked", () => { video.pause(); document.title = "Reference frame ready"; }, { once: true });
    </script>
  </body>
</html>
