<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FogPlay">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.7" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#128a4c"/>
      <stop offset="0.55" stop-color="#0b6b3a"/>
      <stop offset="1" stop-color="#095a31"/>
    </linearGradient>
    <radialGradient id="tableGlow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#16c784" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#16c784" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eafff4" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fogBlur" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- The tinted ground: this is what gives the icon an edge against the
         launcher's white chrome frame. -->
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#tableGlow)"/>

    <!-- Fanned hand, centred on the tile and sized to fill it: at ~40px the
         silhouette is all that survives, so it has to own the frame. -->
    <g transform="rotate(-17 198 268)"><rect x="114" y="151" width="168" height="234" rx="23.52" fill="#253428" opacity="0.22" transform="translate(0 6)"/><rect x="114" y="151" width="168" height="234" rx="23.52" fill="#fffff3"/><rect x="119" y="156" width="158" height="224" rx="18.48" fill="none" stroke="#e8b94f" stroke-width="4"/><path d="M 198 228.22 L 229.92 268 L 198 307.78 L 166.08 268 Z" fill="#16c784"/></g>
    <g transform="rotate(14 322 258)"><rect x="238" y="141" width="168" height="234" rx="23.52" fill="#253428" opacity="0.22" transform="translate(0 6)"/><rect x="238" y="141" width="168" height="234" rx="23.52" fill="#fffff3"/><rect x="243" y="146" width="158" height="224" rx="18.48" fill="none" stroke="#e8b94f" stroke-width="4"/><path d="M 322 218.22 L 353.92 258 L 322 297.78 L 290.08 258 Z" fill="#e8b94f"/></g>

    <!-- The fog: a soft veil drawn across the hand, the app's namesake. -->
    <rect x="-40" y="286" width="592" height="132" fill="url(#fog)" filter="url(#fogBlur)"/>
    <rect x="-40" y="170" width="592" height="76" fill="url(#fog)" filter="url(#fogBlur)" opacity="0.5"/>

    <!-- Inner rim keeps the silhouette crisp when the tile is downscaled. -->
    <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
  </g>
</svg>