  <!-- Flight gates, all right of the mobile crop (x 536..904) and right of the
       desktop copy column, so they never sit under any text. -->
  <g><rect x="1059" y="-20" width="74" height="116" rx="25.16" fill="url(#pylon)"/><rect x="1059" y="-20" width="22.2" height="116" rx="17.61" fill="#ffffff" opacity="0.24"/><rect x="1059" y="320" width="74" height="340" rx="25.16" fill="url(#pylon)"/><rect x="1059" y="320" width="22.2" height="340" rx="17.61" fill="#ffffff" opacity="0.24"/></g>
  <g><rect x="1231" y="-20" width="74" height="230" rx="25.16" fill="url(#pylon)"/><rect x="1231" y="-20" width="22.2" height="230" rx="17.61" fill="#ffffff" opacity="0.24"/><rect x="1231" y="416" width="74" height="244" rx="25.16" fill="url(#pylon)"/><rect x="1231" y="416" width="22.2" height="244" rx="17.61" fill="#ffffff" opacity="0.24"/></g>
