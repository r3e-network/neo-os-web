<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0.05" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#f2fbfe"/>
      <stop offset="0.42" stop-color="#d8f4fb"/>
      <stop offset="1" stop-color="#a8e2f1"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="0.76" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#8bd7ea" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8bd7ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0.14" cy="0.3" r="0.44">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pylon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16c784"/>
      <stop offset="0.55" stop-color="#3fd89b"/>
      <stop offset="1" stop-color="#0f9c66"/>
    </linearGradient>
    <radialGradient id="body" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ffd076"/>
      <stop offset="1" stop-color="#ffa83d"/>
    </radialGradient>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- Calms the lower band so the description copy always has a quiet bed. -->
    <linearGradient id="copyCalm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8fd" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4fbfe" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="640" fill="url(#sky)"/>
  <rect width="1440" height="640" fill="url(#glowRight)"/>
  <rect width="1440" height="640" fill="url(#glowLeft)"/>

