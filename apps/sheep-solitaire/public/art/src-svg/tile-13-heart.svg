<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 200" width="200" height="200">
    
    <!-- Card background -->
    <rect x="6" y="6" width="188" height="188"
          rx="22" ry="22" fill="#F5EDD9" stroke="#D4B88E"
          stroke-width="3.5999999999999996" />
  
    <!-- Icon: heart -->
    <g transform="translate(0, 0)">
      
    <!-- Heart path -->
    <path d="M100,124
             C100,124 66,102 78,86
             C84,76 100,84 100,96
             C100,84 116,76 122,86
             C134,102 100,124 100,124
             Z"
          fill="#FF6F7D" stroke="#3A3530" stroke-width="2.5"/>
    <!-- Heart highlight (left lobe) -->
    <path d="M82,92
             C74,84 82,78 88,84
             C92,88 94,94 96,98
             C92,92 86,88 82,92
             Z"
          fill="#FF9AA5" opacity="0.5"/>
    <!-- Shine dot -->
    <circle cx="84" cy="86" r="3" fill="#FFFFFF"
            />
  
    </g>
</svg>