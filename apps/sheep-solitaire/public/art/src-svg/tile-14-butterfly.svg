<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: butterfly -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Upper wings (larger) -->
    <path d="M96,104
             C92,82 60,72 62,98
             C64,114 86,112 96,104
             Z"
          fill="#16C784" stroke="#26221E" stroke-width="2"/>
    <path d="M104,104
             C108,82 140,72 138,98
             C136,114 114,112 104,104
             Z"
          fill="#16C784" stroke="#26221E" stroke-width="2"/>
    <!-- Lower wings (smaller) -->
    <path d="M96,106
             C94,114 72,128 76,116
             C80,108 90,110 96,106
             Z"
          fill="#FFD36B" stroke="#26221E" stroke-width="2"/>
    <path d="M104,106
             C106,114 128,128 124,116
             C120,108 110,110 104,106
             Z"
          fill="#FFD36B" stroke="#26221E" stroke-width="2"/>
    <!-- Wing patterns (dots) -->
    <circle cx="78" cy="92" r="4" fill="#FFFFFF"
            />
    <circle cx="122" cy="92" r="4" fill="#FFFFFF"
            />
    <circle cx="84" cy="114" r="3" fill="#FFFFFF"
            />
    <circle cx="116" cy="114" r="3" fill="#FFFFFF"
            />
    <!-- Body -->
    <ellipse cx="100" cy="106" rx="3.5" ry="18"
             fill="#26221E" stroke="#26221E" stroke-width="1"/>
    <!-- Antennae -->
    <path d="M98.5,88 Q90,72 94,68"
          fill="none" stroke="#26221E" stroke-width="2" stroke-linecap="round"/>
    <path d="M101.5,88 Q110,72 106,68"
          fill="none" stroke="#26221E" stroke-width="2" stroke-linecap="round"/>
    <!-- Antenna tips -->
    <circle cx="94" cy="68" r="2.5" fill="#16C784"
            />
    <circle cx="106" cy="68" r="2.5" fill="#16C784"
            />
  
    </g>
</svg>