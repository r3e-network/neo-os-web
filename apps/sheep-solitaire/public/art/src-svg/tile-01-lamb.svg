<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: lamb -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    
    <!-- Soft ground shadow lifts the head off the cream card -->
    <ellipse cx="100" cy="150.72" rx="36.96" ry="7" fill="#26221E" opacity="0.14"/>
    <!-- Cream scalloped wool crown -->
    <circle cx="70.27800814211807" cy="82.2128" r="14.96" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="82.84" cy="70.65576749074862" r="15.84" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="100" cy="66.4256" r="16.72" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="117.16" cy="70.65576749074862" r="15.84" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="129.72199185788193" cy="82.2128" r="14.96" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="66.0139998807893" cy="93.6056928410465" r="12.32" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="133.9860001192107" cy="93.6056928410465" r="12.32" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <!-- Droopy ears (cream outer, pink inner) — NOT pink teardrops -->
    <ellipse cx="60.4" cy="108" rx="11" ry="18.48" fill="#FFFDF6"
             stroke="#26221E" stroke-width="4.5" transform="rotate(32,60.4,108)"/>
    <ellipse cx="139.6" cy="108" rx="11" ry="18.48" fill="#FFFDF6"
             stroke="#26221E" stroke-width="4.5" transform="rotate(-32,139.6,108)"/>
    <ellipse cx="59.52" cy="110" rx="5.28" ry="10.56" fill="#FFB5BA"
             transform="rotate(32,59.52,110)"/>
    <ellipse cx="140.48" cy="110" rx="5.28" ry="10.56" fill="#FFB5BA"
             transform="rotate(-32,140.48,110)"/>
    <!-- Face (covers the crown interior, hiding inner scallop strokes) -->
    <ellipse cx="100" cy="112" rx="29.92" ry="28.16" fill="#FBEEDC"
             stroke="#26221E" stroke-width="4.5"/>
    <!-- Wool fringe over the forehead (three bumps dipping into the face) -->
    <circle cx="85.03999999999999" cy="89.12" r="9.68" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4" />
    <circle cx="114.96000000000001" cy="89.12" r="9.68" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4" />
    <circle cx="100" cy="85.6" r="11" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4" />
    <!-- Big green eyes with white highlights -->
    <circle cx="86.8" cy="110" r="9.24" fill="#4CA86A"
           stroke="#26221E" stroke-width="3" />
    <circle cx="113.2" cy="110" r="9.24" fill="#4CA86A"
           stroke="#26221E" stroke-width="3" />
    <circle cx="86.8" cy="111" r="4.4" fill="#26221E"
            />
    <circle cx="113.2" cy="111" r="4.4" fill="#26221E"
            />
    <circle cx="84.16" cy="106" r="2.992" fill="#FFFFFF"
            />
    <circle cx="110.56" cy="106" r="2.992" fill="#FFFFFF"
            />
    <circle cx="89.44" cy="114" r="1.4080000000000001" fill="#FFFFFF"
            />
    <circle cx="115.84" cy="114" r="1.4080000000000001" fill="#FFFFFF"
            />
    <!-- Tiny pink nose + smile -->
    <ellipse cx="100" cy="123.44" rx="4.4" ry="3.168" fill="#FFB5BA"
             stroke="#26221E" stroke-width="2.5"/>
    <path d="M92.96,129.6 Q100,134.88 107.04,129.6"
          fill="none" stroke="#26221E" stroke-width="3" stroke-linecap="round"/>
    <!-- Soft blush dots -->
    <ellipse cx="76.24" cy="120.8" rx="6.6" ry="4.4" fill="#FFB5BA" opacity="0.5"/>
    <ellipse cx="123.76" cy="120.8" rx="6.6" ry="4.4" fill="#FFB5BA" opacity="0.5"/>
  
    <!-- Green hair bow — the lamb's differentiator -->
    <path d="M95,53 C86,39 66,41 69,55
             C71,65 87,63 95,53 Z"
          fill="#4CA86A" stroke="#26221E" stroke-width="4" stroke-linejoin="round"/>
    <path d="M105,53 C114,39 134,41 131,55
             C129,65 113,63 105,53 Z"
          fill="#4CA86A" stroke="#26221E" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="100" cy="53" r="7.5" fill="#7CC47F"
           stroke="#26221E" stroke-width="3.5" />
  
    </g>
</svg>