<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: bell-collar -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Bell dome -->
    <path d="M66,120
             Q66,72 100,64
             Q134,72 134,120
             Z"
          fill="#F6C453" stroke="#26221E" stroke-width="2.5"/>
    <!-- Bell flare bottom -->
    <ellipse cx="100" cy="121" rx="35" ry="9"
             fill="#F6C453" stroke="#26221E" stroke-width="2.5"/>
    <!-- Bell rim line -->
    <ellipse cx="100" cy="119" rx="33" ry="7" fill="none"
              stroke="#D4A033" stroke-width="1.5"/>
    <!-- Clapper -->
    <circle cx="100" cy="128" r="7" fill="#D4A033" stroke="#26221E" stroke-width="1.5"/>
    <!-- Handle ring -->
    <circle cx="100" cy="60" r="7" fill="none" stroke="#D4A033" stroke-width="3"/>
    <!-- Collar band below bell -->
    <rect x="72" y="138" width="56" height="10" rx="3"
          fill="#4CA86A" stroke="#26221E" stroke-width="2"/>
    <!-- Collar studs -->
    <circle cx="86" cy="143" r="2.5" fill="#F6C453"
            />
    <circle cx="114" cy="143" r="2.5" fill="#F6C453"
            />
    <!-- Highlight on bell -->
    <path d="M76,82 Q86,70 96,82"
          fill="none" stroke="#FFF8E0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
    </g>
</svg>