<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 200" width="200" height="200">
    
    <!-- Card background -->
    <rect x="6" y="6" width="188" height="188"
          rx="22" ry="22" fill="#F5EDD9" stroke="#D4B88E"
          stroke-width="3.5999999999999996" />
    <!-- Corner gems – green diamonds -->
    <polygon points="22,10 30,4 38,10 30,18"
             fill="#16C784" stroke="#0E9E68" stroke-width="1" />
    <polygon points="162,10 170,4 178,10 170,18"
             fill="#16C784" stroke="#0E9E68" stroke-width="1" />
    <polygon points="22,190 30,206 38,190 30,182"
             fill="#16C784" stroke="#0E9E68" stroke-width="1" />
    <polygon points="162,190 170,206 178,190 170,182"
             fill="#16C784" stroke="#0E9E68" stroke-width="1" />
  
    <!-- Icon: bell-collar -->
    <g transform="translate(0, 0)">
      
    <!-- Bell dome -->
    <path d="M66,120
             Q66,72 100,64
             Q134,72 134,120
             Z"
          fill="#F6C453" stroke="#3A3530" stroke-width="2.5"/>
    <!-- Bell flare bottom -->
    <ellipse cx="100" cy="121" rx="35" ry="9"
             fill="#F6C453" stroke="#3A3530" stroke-width="2.5"/>
    <!-- Bell rim line -->
    <ellipse cx="100" cy="119" rx="33" ry="7" fill="none"
              stroke="#D4A033" stroke-width="1.5"/>
    <!-- Clapper -->
    <circle cx="100" cy="128" r="7" fill="#D4A033" stroke="#3A3530" stroke-width="1.5"/>
    <!-- Handle ring -->
    <circle cx="100" cy="60" r="7" fill="none" stroke="#D4A033" stroke-width="3"/>
    <!-- Collar band below bell -->
    <rect x="72" y="138" width="56" height="10" rx="3"
          fill="#4CA86A" stroke="#3A3530" stroke-width="2"/>
    <!-- Collar studs -->
    <circle cx="86" cy="143" r="2.5" fill="#F6C453"
            />
    <circle cx="114" cy="143" r="2.5" fill="#F6C453"
            />
    <!-- Highlight on bell -->
    <path d="M76,82 Q86,70 96,82"
          fill="none" stroke="#FFF8E0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
    </g>
</svg>