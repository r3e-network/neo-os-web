<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 200" width="200" height="200">
    
    <!-- Card background -->
    <rect x="6" y="6" width="188" height="188"
          rx="22" ry="22" fill="#F5EDD9" stroke="#D4B88E"
          stroke-width="3.5999999999999996" />
  
    <!-- Icon: fence -->
    <g transform="translate(0, 0)">
      
    <!-- Vertical slats -->
    <rect x="72" y="74" width="10" height="52" rx="2" ry="2" fill="#A67B5B"
            stroke="#3A3530" stroke-width="2" />
    <rect x="91" y="74" width="10" height="52" rx="2" ry="2" fill="#A67B5B"
            stroke="#3A3530" stroke-width="2" />
    <rect x="109" y="74" width="10" height="52" rx="2" ry="2" fill="#A67B5B"
            stroke="#3A3530" stroke-width="2" />
    <rect x="128" y="74" width="10" height="52" rx="2" ry="2" fill="#A67B5B"
            stroke="#3A3530" stroke-width="2" />
    <!-- Horizontal rails -->
    <rect x="68" y="90" width="64" height="7" rx="2" ry="2" fill="#7D5A3E"
            stroke="#3A3530" stroke-width="1.5" />
    <rect x="68" y="116" width="64" height="7" rx="2" ry="2" fill="#7D5A3E"
            stroke="#3A3530" stroke-width="1.5" />
    <!-- Nail heads -->
    <circle cx="72" cy="93" r="2" fill="#D4A033"
            />
    <circle cx="72" cy="119" r="2" fill="#D4A033"
            />
    <circle cx="128" cy="93" r="2" fill="#D4A033"
            />
    <circle cx="128" cy="119" r="2" fill="#D4A033"
            />
    <!-- Ground shadow -->
    <rect x="68" y="128" width="64" height="4" rx="2"
          fill="#7D5A3E" opacity="0.2"/>
  
    </g>
</svg>