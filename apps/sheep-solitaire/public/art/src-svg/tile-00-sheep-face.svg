<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: sheep-face -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Soft ground shadow lifts the head off the cream card -->
    <ellipse cx="100" cy="152" rx="42" ry="7" fill="#26221E" opacity="0.14"/>
    <!-- Cream scalloped wool crown -->
    <circle cx="66.22500925240689" cy="74.06" r="17" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="80.5" cy="60.92700851221434" r="18" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="100" cy="56.12" r="19" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="119.5" cy="60.92700851221434" r="18" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="133.7749907475931" cy="74.06" r="17" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="61.37954531907876" cy="87.00646913755284" r="14" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <circle cx="138.62045468092123" cy="87.00646913755286" r="14" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4.5" />
    <!-- Droopy ears (cream outer, pink inner) — NOT pink teardrops -->
    <ellipse cx="55" cy="104" rx="12.5" ry="21" fill="#FFFDF6"
             stroke="#26221E" stroke-width="4.5" transform="rotate(32,55,104)"/>
    <ellipse cx="145" cy="104" rx="12.5" ry="21" fill="#FFFDF6"
             stroke="#26221E" stroke-width="4.5" transform="rotate(-32,145,104)"/>
    <ellipse cx="54" cy="106" rx="6" ry="12" fill="#FFB5BA"
             transform="rotate(32,54,106)"/>
    <ellipse cx="146" cy="106" rx="6" ry="12" fill="#FFB5BA"
             transform="rotate(-32,146,106)"/>
    <!-- Face (covers the crown interior, hiding inner scallop strokes) -->
    <ellipse cx="100" cy="108" rx="34" ry="32" fill="#FBEEDC"
             stroke="#26221E" stroke-width="4.5"/>
    <!-- Wool fringe over the forehead (three bumps dipping into the face) -->
    <circle cx="83" cy="82" r="11" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4" />
    <circle cx="117" cy="82" r="11" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4" />
    <circle cx="100" cy="78" r="12.5" fill="#FFFDF6"
           stroke="#26221E" stroke-width="4" />
    <!-- Big green eyes with white highlights -->
    <circle cx="85" cy="106" r="10.5" fill="#4CA86A"
           stroke="#26221E" stroke-width="3" />
    <circle cx="115" cy="106" r="10.5" fill="#4CA86A"
           stroke="#26221E" stroke-width="3" />
    <circle cx="85" cy="107" r="5" fill="#26221E"
            />
    <circle cx="115" cy="107" r="5" fill="#26221E"
            />
    <circle cx="82" cy="102" r="3.4" fill="#FFFFFF"
            />
    <circle cx="112" cy="102" r="3.4" fill="#FFFFFF"
            />
    <circle cx="88" cy="110" r="1.6" fill="#FFFFFF"
            />
    <circle cx="118" cy="110" r="1.6" fill="#FFFFFF"
            />
    <!-- Tiny pink nose + smile -->
    <ellipse cx="100" cy="121" rx="5" ry="3.6" fill="#FFB5BA"
             stroke="#26221E" stroke-width="2.5"/>
    <path d="M92,128 Q100,134 108,128"
          fill="none" stroke="#26221E" stroke-width="3" stroke-linecap="round"/>
    <!-- Soft blush dots -->
    <ellipse cx="73" cy="118" rx="7.5" ry="5" fill="#FFB5BA" opacity="0.5"/>
    <ellipse cx="127" cy="118" rx="7.5" ry="5" fill="#FFB5BA" opacity="0.5"/>
  
    </g>
</svg>