<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: hoof-print -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Main pad (bottom) -->
    <path d="M78,118
             Q74,136 88,138
             L112,138
             Q126,136 122,118
             Z"
          fill="#A67B5B" stroke="#26221E" stroke-width="2.5"/>
    <!-- Left toe -->
    <ellipse cx="84" cy="106" rx="12" ry="18"
             fill="#A67B5B" stroke="#26221E" stroke-width="2.5"
             transform="rotate(-12,84,106)"/>
    <!-- Right toe -->
    <ellipse cx="116" cy="106" rx="12" ry="18"
             fill="#A67B5B" stroke="#26221E" stroke-width="2.5"
             transform="rotate(12,116,106)"/>
    <!-- Toe cleft line -->
    <line x1="100" y1="114" x2="100" y2="134"
          stroke="#7D5A3E" stroke-width="2" stroke-linecap="round"/>
    <!-- Pad highlight -->
    <ellipse cx="100" cy="129" rx="8" ry="4" fill="#7D5A3E" opacity="0.3"/>
  
    </g>
</svg>