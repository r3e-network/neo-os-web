<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: milk-bottle -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Bottle body -->
    <rect x="78" y="90" width="44" height="48" rx="6"
          fill="#FFFFFF" stroke="#26221E" stroke-width="2.5"/>
    <!-- Bottle neck -->
    <rect x="88" y="76" width="24" height="16" rx="3"
          fill="#FFFFFF" stroke="#26221E" stroke-width="2.5"/>
    <!-- Bottle cap -->
    <rect x="86" y="68" width="28" height="10" rx="4"
          fill="#16C784" stroke="#26221E" stroke-width="2"/>
    <!-- Cap detail lines -->
    <line x1="92" y1="73" x2="108" y2="73"
          stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Milk label area -->
    <rect x="84" y="100" width="32" height="24" rx="3"
          fill="#F0F6FF" stroke="#C5E8F4" stroke-width="1.2"/>
    <!-- Milk drop icon on label -->
    <path d="M100,105 Q93,116 100,120 Q107,116 100,105 Z"
          fill="#C5E8F4" opacity="0.7"/>
    <!-- Bottle shine -->
    <rect x="83" y="94" width="5" height="40" rx="2.5"
          fill="#FFFFFF" opacity="0.35"/>
  
    </g>
</svg>