<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: carrot -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Carrot body (diagonal) -->
    <path d="M94,134
             Q80,110 104,70
             Q114,66 110,76
             Q96,118 106,134
             Z"
          fill="#FF8A4C" stroke="#26221E" stroke-width="2.5"/>
    <!-- Carrot texture lines -->
    <line x1="92" y1="118" x2="98" y2="122"
          stroke="#E06A28" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="96" y1="106" x2="102" y2="110"
          stroke="#E06A28" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="102" y1="92" x2="106" y2="96"
          stroke="#E06A28" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Leafy top -->
    <path d="M104,70 Q92,52 84,56"
          fill="#4CA86A" stroke="#26221E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M106,70 Q104,48 102,50"
          fill="#7CC47F" stroke="#26221E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M108,73 Q120,54 124,62"
          fill="#4CA86A" stroke="#26221E" stroke-width="2" stroke-linejoin="round"/>
    <!-- Highlight -->
    <path d="M98,120 Q102,108 106,94"
          fill="none" stroke="#FFAA70" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  
    </g>
</svg>