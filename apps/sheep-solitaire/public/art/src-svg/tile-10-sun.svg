    <polygon points="162,190 170,206 178,190 170,182"
             fill="#16C784" stroke="#0E9E68" stroke-width="1" />
  
    <!-- Icon: sun -->
    <g transform="translate(0, 0)">
      
    <!-- Sun body -->
    <circle cx="100" cy="100" r="32" fill="#FFD36B"
