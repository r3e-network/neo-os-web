    <!-- Sun face (simple happy) -->
    <!-- Eyes -->
    <circle cx="90" cy="96" r="3" fill="#3A3530"
            />
    <circle cx="110" cy="96" r="3" fill="#3A3530"
            />
    <!-- Smile -->
    <path d="M90,108 Q100,116 110,108"
          fill="none" stroke="#3A3530" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="84" cy="105" rx="5" ry="3.5" fill="#FFB5BA" opacity="0.45"/>
    <ellipse cx="116" cy="105" rx="5" ry="3.5" fill="#FFB5BA" opacity="0.45"/>
  
    </g>
