<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: sun -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Sun body -->
    <circle cx="100" cy="100" r="32" fill="#FFD36B"
           stroke="#26221E" stroke-width="2.5" />
    <!-- Rays (12 alternating lengths) -->
    <line x1="136" y1="100"
                    x2="150" y2="100"
                    stroke="#FFD36B" stroke-width="4"
                    stroke-linecap="round"/>
    <line x1="131.1769145362398" y1="118"
                    x2="138.97114317029974" y2="122.5"
                    stroke="#FFD36B" stroke-width="3"
                    stroke-linecap="round"/>
    <line x1="118" y1="131.1769145362398"
                    x2="125" y2="143.30127018922192"
                    stroke="#FFD36B" stroke-width="4"
                    stroke-linecap="round"/>
    <line x1="100" y1="136"
                    x2="100" y2="145"
                    stroke="#FFD36B" stroke-width="3"
                    stroke-linecap="round"/>
    <line x1="82" y1="131.1769145362398"
                    x2="75.00000000000001" y2="143.30127018922195"
                    stroke="#FFD36B" stroke-width="4"
                    stroke-linecap="round"/>
    <line x1="68.82308546376021" y1="118"
                    x2="61.02885682970026" y2="122.5"
                    stroke="#FFD36B" stroke-width="3"
                    stroke-linecap="round"/>
    <line x1="64" y1="100"
                    x2="50" y2="100"
                    stroke="#FFD36B" stroke-width="4"
                    stroke-linecap="round"/>
    <line x1="68.82308546376021" y1="82"
                    x2="61.02885682970026" y2="77.5"
                    stroke="#FFD36B" stroke-width="3"
                    stroke-linecap="round"/>
    <line x1="81.99999999999999" y1="68.82308546376021"
                    x2="74.99999999999997" y2="56.698729810778076"
                    stroke="#FFD36B" stroke-width="4"
                    stroke-linecap="round"/>
    <line x1="100" y1="64"
                    x2="99.99999999999999" y2="55"
                    stroke="#FFD36B" stroke-width="3"
                    stroke-linecap="round"/>
    <line x1="118" y1="68.82308546376021"
                    x2="125" y2="56.69872981077807"
                    stroke="#FFD36B" stroke-width="4"
                    stroke-linecap="round"/>
    <line x1="131.1769145362398" y1="81.99999999999999"
                    x2="138.97114317029974" y2="77.49999999999997"
                    stroke="#FFD36B" stroke-width="3"
                    stroke-linecap="round"/>
    <!-- Ray outer dots (on long rays) -->
    <circle cx="152" cy="100" r="2.5"
                fill="#FFD36B" stroke="#26221E" stroke-width="1"/>
    <circle cx="126" cy="145.0333209967908" r="2.5"
                fill="#FFD36B" stroke="#26221E" stroke-width="1"/>
    <circle cx="74.00000000000001" cy="145.03332099679082" r="2.5"
                fill="#FFD36B" stroke="#26221E" stroke-width="1"/>
    <circle cx="48" cy="100" r="2.5"
                fill="#FFD36B" stroke="#26221E" stroke-width="1"/>
    <circle cx="73.99999999999997" cy="54.9666790032092" r="2.5"
                fill="#FFD36B" stroke="#26221E" stroke-width="1"/>
    <circle cx="126" cy="54.966679003209194" r="2.5"
                fill="#FFD36B" stroke="#26221E" stroke-width="1"/>
    <!-- Sun face (simple happy) -->
    <!-- Eyes -->
    <circle cx="90" cy="96" r="3" fill="#26221E"
            />
    <circle cx="110" cy="96" r="3" fill="#26221E"
            />
    <!-- Smile -->
    <path d="M90,108 Q100,116 110,108"
          fill="none" stroke="#26221E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="84" cy="105" rx="5" ry="3.5" fill="#FFB5BA" opacity="0.45"/>
    <ellipse cx="116" cy="105" rx="5" ry="3.5" fill="#FFB5BA" opacity="0.45"/>
  
    </g>
</svg>