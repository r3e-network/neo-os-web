<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 200" width="200" height="200">
    
    <!-- Card background -->
    <rect x="6" y="6" width="188" height="188"
          rx="22" ry="22" fill="#F5EDD9" stroke="#D4B88E"
          stroke-width="3.5999999999999996" />
  
    <!-- Icon: wool-ball -->
    <g transform="translate(0, 0)">
      
    <!-- Yarn ball body -->
    <circle cx="100" cy="102" r="40" fill="#F8F2E6"
           stroke="#3A3530" stroke-width="3" />
    <!-- Wrapped yarn lines (latitude curves) -->
    <ellipse cx="100" cy="82" rx="36" ry="10" fill="none"
              stroke="#E5D7C1" stroke-width="2.5" opacity="0.55"/>
    <ellipse cx="100" cy="96" rx="39" ry="12" fill="none"
              stroke="#E5D7C1" stroke-width="2.5" opacity="0.5"/>
    <ellipse cx="100" cy="114" rx="36" ry="9" fill="none"
              stroke="#E5D7C1" stroke-width="2.5" opacity="0.45"/>
    <!-- Highlight -->
    <ellipse cx="86" cy="86" rx="12" ry="8" fill="#FFFFFF" opacity="0.35"/>
    <!-- Tail end sticking out -->
    <path d="M136,106 Q158,96 152,118"
          fill="none" stroke="#F8F2E6" stroke-width="6" stroke-linecap="round"/>
    <path d="M136,106 Q158,96 152,118"
          fill="none" stroke="#3A3530" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  
    </g>
</svg>