<svg xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 200 232" width="200" height="232">
    
    <!-- Hard offset sticker shadow (flat, no blur) -->
    <rect x="17" y="20" width="180" height="208"
          rx="28" ry="28" fill="#26221E" opacity="0.30" />
    <!-- Gray-green thickness strip (card stack edge) -->
    <rect x="10" y="26" width="180" height="192"
          rx="28" ry="28" fill="#97A886" stroke="#26221E" stroke-width="4.5" />
    <!-- Cream tile face -->
    <rect x="10" y="10" width="180" height="192"
          rx="26" ry="26" fill="#F8F6E8" stroke="#26221E" stroke-width="4.5" />
  
    <!-- Icon: cloud -->
    <g transform="translate(100, 107) scale(1.16) translate(-100, -100)">
      
    <!-- Cloud body (overlapping circles) -->
    <circle cx="82" cy="106" r="28" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
    <circle cx="118" cy="106" r="28" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
    <circle cx="94" cy="92" r="30" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
    <circle cx="114" cy="96" r="22" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
    <circle cx="100" cy="110" r="26" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
    <!-- Sky-blue tint overlay (bottom) -->
    <clipPath id="cloudClip">
      <use href="#cloudBody"/>
    </clipPath>
    <defs>
      <g id="cloudBody">
        <circle cx="82" cy="106" r="28" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
        <circle cx="118" cy="106" r="28" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
        <circle cx="94" cy="92" r="30" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
        <circle cx="114" cy="96" r="22" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
        <circle cx="100" cy="110" r="26" fill="#FFFFFF"
           stroke="#26221E" stroke-width="2" />
      </g>
    </defs>
    <rect x="60" y="100" width="80" height="40"
          fill="#C5E8F4" opacity="0.25" clip-path="url(#cloudClip)"/>
    <!-- Cute face -->
    <circle cx="90" cy="98" r="2.5" fill="#26221E"
            />
    <circle cx="110" cy="98" r="2.5" fill="#26221E"
            />
    <path d="M95,104 Q100,108 105,104"
          fill="none" stroke="#26221E" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="82" cy="104" rx="5" ry="3.5" fill="#FFB5BA" opacity="0.35"/>
    <ellipse cx="118" cy="104" rx="5" ry="3.5" fill="#FFB5BA" opacity="0.35"/>
  
    </g>
</svg>